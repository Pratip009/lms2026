<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5"
    />

    <!-- Title -->
    <title>
      Bright Learning Academy | Professional Online Courses & Healthcare Training
    </title>

    <!-- SEO -->
    <meta
      name="description"
      content="Bright Learning Academy provides high-quality online learning with healthcare training, medical assistant programs, certification courses, video lessons, quizzes, and professional skill development."
    />

    <meta
      name="keywords"
      content="Bright Learning Academy, healthcare courses, medical assistant training, online learning, LMS, professional certification, online education, healthcare certification, skill development, career courses"
    />

    <meta name="author" content="Bright Learning Academy" />
    <meta name="robots" content="index,follow" />
    <meta name="language" content="English" />

    <!-- Canonical -->
    <link rel="canonical" href="https://bhilearning.com/" />

    <!-- Theme -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Favicons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Bright Learning Academy | Professional Online Learning Platform"
    />

    <meta
      property="og:description"
      content="Advance your career through healthcare training, medical assistant programs, certification courses, and professional online learning."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bright Learning Academy" />
    <meta property="og:url" content="https://bhilearning.com/" />

    <meta
      property="og:image"
      content="https://bhilearning.com/preview.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://bhilearning.com/preview.png"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Bright Learning Academy | Professional Online Learning Platform"
    />

    <meta
      name="twitter:description"
      content="Healthcare training, certification programs, online courses, video lessons, assessments, and professional career development."
    />

    <meta
      name="twitter:image"
      content="https://bhilearning.com/preview.png"
    />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Bright Learning Academy",
        "url": "https://bhilearning.com",
        "logo": "https://bhilearning.com/logo192.png",
        "description": "Bright Learning Academy provides professional online courses, healthcare training, medical assistant programs, certification courses, and career-focused education.",
        "email": "info@bhilearning.com",
        "sameAs": [],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://bhilearning.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <noscript>
      JavaScript is required to run Bright Learning Academy.
    </noscript>

    <div id="root"></div>
  </body>
</html>
